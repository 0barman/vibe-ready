[package]
name = "vibe-ready"
version = "0.2.0"
edition = "2021"
description = "Composable runtime, logging, scheduling, and storage foundations for vibe-coding Rust projects."
license = "MIT"
repository = "https://github.com/0barman/vibe-ready"
readme = "README.md"
keywords = ["vibe-coding", "runtime", "storage", "logging", "scheduler"]
categories = ["asynchronous", "development-tools", "database"]

[features]
default = ["log-diesel", "store-diesel-sqlite"]
log-diesel = ["dep:diesel"]
# Noop backends are always available; these empty features are kept for compatibility.
log-noop = []
store-diesel-sqlite = ["dep:diesel"]
store-noop = []

[dependencies]
log  = { version = "0.4.29", features = ["max_level_trace", "release_max_level_info"] }
tokio = { version = "1.50.0", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    "io-util",
    "fs",
    "net",
] }

chrono = "0.4.44"
indexmap = { version = "2.14.0", features = ["serde"] }
lazy_static = "1.5.0"
futures="0.3"
threadpool = "1.8.1"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
diesel = { version = "2.3.9", features = ["sqlite"], optional = true }

[[test]]
name = "engine_lifecycle_scenarios"
path = "test/scenarios/engine_lifecycle_scenarios.rs"

[[test]]
name = "kv_persistence_scenarios"
path = "test/scenarios/kv_persistence_scenarios.rs"

[[test]]
name = "panic_timeout_scenarios"
path = "test/scenarios/panic_timeout_scenarios.rs"

[[test]]
name = "concurrency_deadlock_scenarios"
path = "test/scenarios/concurrency_deadlock_scenarios.rs"

[[test]]
name = "feature_matrix_scenarios"
path = "test/scenarios/feature_matrix_scenarios.rs"
